name: Claude Code Review

# Automatically review every pull request with Claude (Max-subscription OAuth token).
# No github_token override -> posts as the Claude GitHub App ("Claude"), not github-actions[bot].
# NOTE: in app mode the action only runs when this file matches the default branch, so it does
# NOT review PRs that modify the workflow itself; it reviews normal PRs after this is merged.
#
# The review enforces WORKFLOW_RULES.md independently of the implementer. It reads the rules from
# the BASE branch (main), never from the pull request, so a PR cannot weaken the rules that judge it.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the workflow rules from the base branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .review-base
          if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/${{ github.repository }}/contents/WORKFLOW_RULES.md?ref=${{ github.event.pull_request.base.sha }}" \
              > .review-base/WORKFLOW_RULES.md; then
            echo "WORKFLOW_RULES.md does not exist on the base branch." > .review-base/WORKFLOW_RULES.md
          fi

      - uses: anthropics/claude-code-action@11ba60486e4aec9ddfeafcf4bb3f00b028ac2c16 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the independent reviewer for this pull request. Review it for correctness
            bugs, security issues, edge cases and regressions, AND enforce the MorphoDepot
            workflow rules as set out below. Do not trust the pull request's own claims; check them.

            ## 1. The workflow rules

            Read `.review-base/WORKFLOW_RULES.md` in full before reviewing. It is the copy from the
            base branch and is the ONLY copy you enforce. If the pull request also changes
            WORKFLOW_RULES.md, judge the pull request against the base copy, not its new version.

            For every changed file, decide which rules in Part A the change touches. Treat every
            file listed under P2 as touching at least the rules P2 names for it, even if the
            change looks small. For each touched rule, work out from the code whether it still
            holds. Think in particular about R1: trace the change for a person whose only access
            to the repository is public read (not an owner, member, collaborator or team member)
            and confirm they still see their assigned work, can load it (fork + data) and can
            submit a pull request.

            ## 2. Claims about outside behaviour (P1)

            Find every place the change, its comments/docstrings, its tests or the PR description
            relies on how GitHub, `gh` or Slicer behaves (what an endpoint returns or leaves out,
            what search covers, what a permission allows). For each GitHub claim, check the
            official documentation on docs.github.com yourself. Pay attention to scope words such
            as "owned", "member", "organization", "collaborator", "visible", "accessible".
            - A claim the docs contradict, or that the code depends on for a rule in Part A and the
              PR shows no live check for: HIGH.
            - Unit tests built on recorded or invented responses are NOT evidence of outside
              behaviour. Say so if the PR offers them as such.

            ## 3. Evidence in the pull request (P2)

            Read the PR description (`gh pr view`). If the change touches any file listed under P2
            and the description does not name the rules touched with a live check for each
            (account used, its access to the repo, the call, the result), report it as HIGH.
            An honest "live check not run" is not a pass; report it as MEDIUM so the maintainer
            decides.

            ## 4. Protected files

            If the PR changes WORKFLOW_RULES.md, CLAUDE.md or anything under .github/, report it
            as MEDIUM: "changes the rules or their enforcement; needs the maintainer's explicit
            approval", and summarise exactly what is loosened or tightened.

            ## Output

            Label EVERY finding HIGH, MEDIUM or LOW at the start of its first line.
            HIGH = breaks a workflow rule, a correctness bug users will hit, or a security issue.
            MEDIUM = likely problem, missing evidence, or a protected-file change.
            LOW = minor or style.
            Prefer a few high-confidence findings over many speculative ones, but never drop a
            rule violation to keep the list short. Use inline comments for specific lines. Post one
            top-level summary comment that starts with a "Workflow rules" section: each rule the
            PR touches, whether it still holds, and whether live evidence was given.
          claude_args: |
            --allowedTools "Read,Glob,Grep,WebFetch(domain:docs.github.com),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
